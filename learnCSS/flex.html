<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        body{
            background-color: aqua;
        }
        h1{
            text-align: center;
            font-family: cursive;
            font-size: 50px;
        }
        .items{
            background-color: blueviolet;
            width: 200px;
            height:150px;
            margin:10px;
            margin-top: 20px;
            color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
           font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .container{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;

        }
    </style>
</head>
<body>
    <h1>Indian Cricket Team</h1>
    <div class="container">
        <div class="items">Rohit Sharma</div>
        <div class="items"> Shikhar Dhawan</div>
        <div class="items">Virat Kohali</div>
        <div class="items">K.L Rahul</div>
        <div class="items">Surykumar Yadav</div>
        <div class="items">M.S.Dhoni</div>
        <div class="items">Hardik Pandya</div>
        <div class="items">Ravindra Jadeja</div>
        <div class="items">Jasprit Bumarah</div>
        <div class="items">BhuvneshwarKumar</div>
        <div class="items">R.Ashwin</div>
    </div>
</body>
</html>
