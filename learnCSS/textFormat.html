<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextFormats</title>
    <style>
        .uppercase{
            text-transform: uppercase;
            color: black;
        }
        .lowercase{
            text-transform: lowercase;
            color: blueviolet;
        }
        .capitalize{
            text-transform: capitalize;
            color: greenyellow;
        }
    </style>
</head>
<body>
    <h1 class="uppercase"> Hello I'm Rushii !</h1>
    <h1 class="lowercase"> Hello I'm Rushii !</h1>
    <h1 class="capitalize"> hello I'm rushii !</h1>
</body>
</html>
