<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions of CSS</title>
    <style>
        body{
            background-color: aqua;
        }
        .box{
            width: 200px;
            height: 100px;
            border: 4px inset grey;
            background-color: yellowgreen;
            text-align: center;
            line-height: 100px;
            margin: 10px;
            color: white;
        }
        .box1{
            position: static;
        }
        .box2{
            position: relative;
            top: 100px;
            left: 00px;
        }
        .box3{
            position: absolute;
            top: 0px;
            left: 400px;
        }
        .box4{
            position: sticky;
            top: 0px;
            left: 350px;
        }
        .box5{
            position: fixed;
            right: 10px;
            bottom: 100px;
        }
    </style>
</head>
<body>
    <!-- 5 positions in CSS -->
    <div class="box box1">Sattic</div>
    <div class="box box2">Relaative</div>
    <div class="box box3">Absolute</div>
    <div class="box box4">Sticky</div>
    <div class="box box5">Fixed</div>

</html>
